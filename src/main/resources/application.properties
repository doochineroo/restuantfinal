spring.application.name=choprest

# MySQL Database Configuration (로컬 개발용)
# 프로덕션: Google Cloud VM 내부 MySQL 사용 (application-gcp.properties)
# AWS RDS 설정은 더 이상 사용하지 않음 (application-aws.properties)
spring.datasource.url=jdbc:mysql://localhost:3306/chopplan?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

# H2 console 비활성화
spring.h2.console.enabled=false

# Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JPA Configuration (MySQL용)
# ddl-auto=update: 엔티티 변경 시 테이블 자동 업데이트 (개발 환경)
# 백엔드 실행 시 모든 @Entity 클래스의 테이블이 자동 생성됩니다
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Kakao API Configuration
# API 키가 유효하지 않거나 만료된 경우 https://developers.kakao.com 에서 새로 발급받으세요
kakao.api.key=363d03dddf733d17f5b3edb9be1e8911
kakao.api.key1=363d03dddf733d17f5b3edb9be1e8911
kakao.api.key2=5d1502f95e6ae410f5ce45abf596d639
kakao.api.key3=674451cc66e051ddfca840a7f734213c
kakao.api.url=https://dapi.kakao.com/v2/local/search/keyword.json
kakao.api.reverse.url=https://dapi.kakao.com/v2/local/geo/coord2address.json

# Server Configuration
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# SSL 설정 비활성화

# Logging Configuration
logging.level.com.example.choprest=WARN
logging.level.org.springframework.web.reactive.function.client=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
spring.jpa.show-sql=false

# Email Configuration (Gmail 예시)
# 실제 사용 시 Gmail 앱 비밀번호를 사용하거나, 다른 SMTP 서버를 설정하세요
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Verification Configuration
app.email.from=noreply@chopplan.com
app.email.verification.expire-minutes=30
app.email.verification.base-url=http://localhost:8080

# Spring Security Configuration (API 서버용 - 자동 UserDetailsService 비활성화)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB



