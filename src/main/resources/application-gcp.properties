# Google Cloud VM 내부 MySQL 설정 (Always Free 티어)
# 사용법: java -jar app.jar --spring.profiles.active=gcp
# 또는 환경변수: SPRING_PROFILES_ACTIVE=gcp

# VM 내부 MySQL 연결 (localhost 사용 - Cloud SQL 대신!)
# VM 내부에 MySQL이 설치되어 있으므로 localhost 사용
spring.datasource.url=jdbc:mysql://localhost:3306/chopplan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=chopplan123
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# 트랜잭션 즉시 커밋 (실시간 반영)
spring.jpa.properties.hibernate.flush_mode=commit
spring.jpa.properties.hibernate.jdbc.batch_size=20

# MySQL 트랜잭션 격리 수준 (동시성 처리)
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# 커넥션 풀 설정 (실시간 처리 최적화)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# H2 console 비활성화
spring.h2.console.enabled=false

# Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Kakao API Configuration (application.properties와 동일)
kakao.api.key=363d03dddf733d17f5b3edb9be1e8911
kakao.api.key1=363d03dddf733d17f5b3edb9be1e8911
kakao.api.key2=5d1502f95e6ae410f5ce45abf596d639
kakao.api.key3=674451cc66e051ddfca840a7f734213c
kakao.api.url=https://dapi.kakao.com/v2/local/search/keyword.json
kakao.api.reverse.url=https://dapi.kakao.com/v2/local/geo/coord2address.json

# Server Configuration
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Logging Configuration
logging.level.com.example.choprest=WARN
logging.level.org.springframework.web.reactive.function.client=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
spring.jpa.show-sql=false

# Email Configuration (Gmail 예시)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Verification Configuration
app.email.from=noreply@chopplan.com
app.email.verification.expire-minutes=30
app.email.verification.base-url=http://localhost:8080

# Spring Security Configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB


